name: Build Startrack Releases (Windows + Android)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - name: Install frontend dependencies
        working-directory: ./client
        run: npm install
      - name: Setup Signing Keys
        shell: pwsh
        env:
          KEY_CONTENT: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Path "$HOME\.tauri" -Force | Out-Null
          
          # Windows updater private key
          $cleanKey = $env:KEY_CONTENT.Trim([char]0xFEFF, "`r", "`n", " ")
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText("$HOME\.tauri\startrack-updater.key", $cleanKey, $utf8NoBom)
          
          # Android keystore
          if ($env:KEYSTORE_BASE64) {
            $b64 = $env:KEYSTORE_BASE64 -replace '\s+', ''
            $jksBytes = [Convert]::FromBase64String($b64)
            [System.IO.File]::WriteAllBytes("$HOME\.tauri\startrack-android.jks", $jksBytes)
            $jksPath = "$HOME/.tauri/startrack-android.jks".Replace("\", "/")
            $pass = $env:KEYSTORE_PASSWORD.Trim()
            $props = "storeFile=$jksPath`nkeyAlias=startrack`npassword=$pass"
            [System.IO.File]::WriteAllText("$HOME\.tauri\startrack-android.properties", $props, $utf8NoBom)
          }
      - name: Build NSIS Installer (.exe)
        working-directory: ./client
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.temp }}\..\.tauri\startrack-updater.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $keyPath = "$HOME\.tauri\startrack-updater.key"
          $env:TAURI_SIGNING_PRIVATE_KEY = $keyPath
          npx tauri build --bundles nsis
      - name: Build Android APK
        working-directory: ./client
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          if (Test-Path "$HOME\.tauri\startrack-android.properties") {
            node scripts/android.mjs
          } else {
            echo "No Android keystore configured, skipping APK build"
          }
      - name: Publish GitHub Release
        shell: pwsh
        working-directory: ./client
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $dir = "src-tauri/target/release/bundle/nsis"
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          $exe = "Startrack_${ver}_x64-setup.exe"
          $sig = (Get-Content "$dir/$exe.sig" -Raw).Trim()
          $notes = if (Test-Path "notes-$ver.md") { Get-Content "notes-$ver.md" -Raw } else { "Startrack $ver" }
          
          $latest = @{
            version = $ver
            notes = $notes.Trim()
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $sig
                url = "https://github.com/cubestalkertube-creator/startrack/releases/download/v$ver/$exe"
              }
            }
          }
          $latest | ConvertTo-Json -Depth 5 | Set-Content "$dir/latest.json" -Encoding utf8
          Set-Content "$dir/release-notes.md" -Value $notes -Encoding utf8
          
          $apk = "src-tauri/target/android/Startrack_${ver}.apk"
          $files = @("$dir/$exe", "$dir/$exe.sig", "$dir/latest.json")
          if (Test-Path $apk) { $files += $apk }
          
          gh release view "v$ver" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "v$ver" $files --clobber
          } else {
            gh release create "v$ver" $files --title "Startrack $ver" --notes-file "$dir/release-notes.md"
          }
      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Startrack_Windows
          path: client/src-tauri/target/release/bundle/nsis/*.exe
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Startrack_Android
          path: client/src-tauri/target/android/*.apk
