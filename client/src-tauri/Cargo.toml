[package]
name = "startrack"
version = "0.1.19"
edition = "2021"

[lib]
name = "startrack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1.54.1", features = ["net", "io-util", "time", "rt"] }
tauri-plugin-opener = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(windows)'.dependencies]
netdev = "0.47.0"
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_NetworkManagement_IpHelper", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
