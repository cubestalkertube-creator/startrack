[package]
name = "startrack"
version = "0.1.5"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-updater = "2"
tokio = { version = "1.54.1", features = ["net", "io-util", "time", "rt"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(windows)'.dependencies]
netdev = "0.47.0"
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_NetworkManagement_IpHelper"] }
